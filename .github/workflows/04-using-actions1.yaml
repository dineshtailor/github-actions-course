name: 04-using-action
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: install dependencies
        run: npm ci
        working-directory: 04-using-actions/react-app/  
        

