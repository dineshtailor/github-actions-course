name: 13-using cacheing-DKT_
on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to use the Cache
        default: true
        type: boolean
jobs:
  install-dep:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-caching/react-app
    outputs:
      deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}      
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "25.x"    
      - name: Calculate cache key
        id: cache-key
        run: |
          echo "CACHE_KEY=deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}" >> $GITHUB_OUTPUT       
      - name: Download cache dependencies
        uses: actions/cache@v6
        if: ${{ inputs.use-cache }}
        id: cache
        with: 
          path: 13-caching/react-app/node_modules
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}


      - name: install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
  build:
    runs-on: ubuntu-latest
    needs: install-deps  
    defaults:
      run:
        working-directory: 13-caching/react-app
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "25.x"    
      - name: Download cache dependencies
        uses: actions/cache@v6
        if: ${{ inputs.use-cache }}
        id: cache
        with: 
          path: 13-caching/react-app/node_modules
          key: ${{ needs.install-deps.output.deps-cache-key }}

      - name: install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: testing
        run: npm run test
      - name: build
        run: npm run build    
      - name: Deploy on nonprod
        run: echo "Deploying on non prod"      
